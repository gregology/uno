# Portainer: Stacks → Add stack → Repository, pointing at this repo and this file.
# Portainer builds the image on the host from the Dockerfile in the repo.
services:
  uno:
    build: .
    image: uno:latest
    container_name: uno
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      # Published on all of the host's interfaces, so the game is reachable on the LAN at
      # http://<server IP>:3000 (or whatever UNO_PORT is set to), which is where the
      # Cloudflare tunnel points.
      - "${UNO_PORT:-3000}:3000"
    environment:
      TURN_SECONDS: ${TURN_SECONDS:-30}
      MAX_AUTO_TURNS: ${MAX_AUTO_TURNS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
